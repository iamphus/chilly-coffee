<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chilly Coffee – bộ nhân vật</title>
<style>
html,body{margin:0;height:100%;background:#efe9df;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#2c2622;overflow:hidden}
#c{display:block;width:100%;height:100%}
#ui{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:inherit;font-size:13px;color:#2c2622;background:rgba(255,255,255,.85);border:1px solid rgba(0,0,0,.15);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:#c9773a;border-color:#c9773a;color:#fff}
#info{position:absolute;left:12px;bottom:12px;font-size:13px;background:rgba(255,255,255,.85);padding:8px 12px;border-radius:8px;max-width:calc(100% - 48px);line-height:1.5}
</style></head><body>
<canvas id="c"></canvas>
<div id="ui"></div>
<div id="info">Bấm vào một nhân vật để xem tên. Kéo để xoay, cuộn để phóng to.</div>
<script src="characters.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/controls/OrbitControls.js';
import { RoomEnvironment } from 'https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/environments/RoomEnvironment.js';
const cv=document.getElementById('c'),info=document.getElementById('info');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,1.5));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();S.background=new THREE.Color(0xefe9df);const pm=new THREE.PMREMGenerator(R);S.environment=pm.fromScene(new RoomEnvironment(),0.04).texture;
S.add(new THREE.HemisphereLight(0xffffff,0x9a8a7a,0.5));const d=new THREE.DirectionalLight(0xfff2e0,0.9);d.position.set(4,8,6);d.castShadow=true;d.shadow.mapSize.set(2048,2048);Object.assign(d.shadow.camera,{left:-9,right:9,top:6,bottom:-6});S.add(d);
const fl=new THREE.Mesh(new THREE.CircleGeometry(9,48),new THREE.MeshStandardMaterial({color:0xe2d8c8,roughness:0.9}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;S.add(fl);
const C=new THREE.PerspectiveCamera(30,1,0.1,100);C.position.set(0,2.2,8.6);const ctl=new OrbitControls(C,cv);ctl.target.set(0,0.55,0);ctl.enableDamping=true;ctl.maxPolarAngle=1.5;
const CLIPS=[['Dung','Đứng'],['Di_Bo','Đi bộ'],['Ngoi_Go_Phim','Ngồi gõ phím'],['Uong','Ngồi uống nước'],['Vay_Tay','Vẫy tay'],['Pha_Che','Pha chế']];
const chars=CHAR_PRESETS.map((p,i)=>{const {root,clips}=buildCharacter(THREE,p);const row=i<6?0:1;root.position.set(((i%6)-2.5)*1.0,0,row?-1.2:0.6);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});S.add(root);const m=new THREE.AnimationMixer(root);return {p,root,clips,m,act:null};});
function play(name){chars.forEach(c=>{const clip=c.clips.find(x=>x.name===name);const a=c.m.clipAction(clip);a.reset().fadeIn(0.25).play();a.time=Math.random()*0.3;if(c.act&&c.act!==a)c.act.fadeOut(0.25);c.act=a;});document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on',b.dataset.c===name));}
const ui=document.getElementById('ui');CLIPS.forEach(([k,t])=>{const b=document.createElement('button');b.textContent=t;b.dataset.c=k;b.onclick=()=>play(k);ui.appendChild(b);});
play('Dung');
let down=null;cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;const r=cv.getBoundingClientRect();const v=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);const rc=new THREE.Raycaster();rc.setFromCamera(v,C);const h=rc.intersectObjects(chars.map(c=>c.root),true)[0];if(!h)return;let o=h.object;while(o.parent&&!o.userData.preset)o=o.parent;const p=o.userData.preset;if(p)info.textContent=p.ten+' – file: '+p.id+'.glb';});
function resize(){const w=cv.clientWidth,h=cv.clientHeight;R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();}addEventListener('resize',resize);resize();
const clk=new THREE.Clock();(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),0.1);chars.forEach(c=>c.m.update(dt));ctl.update();R.render(S,C);})();
</script></body></html>
